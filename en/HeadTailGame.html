<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>單字挑戰 Word Game</title>
  
  <!-- 引入 Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 Lucide 圖示庫 CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* 自訂捲軸樣式 */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f3f4; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #dadce0; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #bdc1c6; }
    
    /* 點擊按鈕的縮放動畫 */
    .active-scale:active { transform: scale(0.95); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center font-sans bg-[#F8F9FA] p-4 text-[#202124]">

  <!-- 遊戲主要容器 -->
  <div class="w-full max-w-md bg-white rounded-[2.5rem] shadow-lg p-6 relative overflow-hidden border-4 border-[#F8F9FA]">
    
    <!-- 頂部標題與分數 -->
    <div class="flex justify-between items-center mb-8">
      <div class="flex space-x-1 text-2xl font-black tracking-wider">
        <span style="color: #4285F4">單</span>
        <span style="color: #EA4335">字</span>
        <span style="color: #FBBC05">挑</span>
        <span style="color: #34A853">戰</span>
      </div>
      <div class="flex items-center space-x-2 bg-[#FEF7E0] text-[#E37400] px-4 py-2 rounded-full font-bold shadow-sm">
        <i data-lucide="award" class="w-5 h-5"></i>
        <span id="scoreDisplay">0 分</span>
      </div>
    </div>

    <!-- 遊戲主體：字首與字尾顯示 -->
    <div id="wordBlocks" class="flex justify-center items-center space-x-4 mb-8 transition-transform duration-300">
      <!-- 字首方塊 -->
      <div class="w-20 h-24 rounded-2xl flex flex-col items-center justify-center shadow-md transform -rotate-3 bg-[#4285F4]">
        <span id="firstLetter" class="text-white text-4xl font-black uppercase">A</span>
        <span class="text-blue-100 text-xs font-bold mt-1">開頭</span>
      </div>
      
      <!-- 中間虛線 -->
      <div class="flex space-x-2">
        <div class="w-2 h-2 rounded-full bg-[#FBBC05]"></div>
        <div class="w-2 h-2 rounded-full bg-[#FBBC05]"></div>
        <div class="w-2 h-2 rounded-full bg-[#FBBC05]"></div>
      </div>

      <!-- 字尾方塊 -->
      <div class="w-20 h-24 rounded-2xl flex flex-col items-center justify-center shadow-md transform rotate-3 bg-[#EA4335]">
        <span id="lastLetter" class="text-white text-4xl font-black uppercase">T</span>
        <span class="text-red-100 text-xs font-bold mt-1">結尾</span>
      </div>
    </div>

    <!-- 狀態訊息提示 -->
    <div class="flex items-center justify-center min-h-[2.5rem] mb-4">
      <div id="messageBox" class="hidden items-center space-x-2 font-bold px-4 py-2 rounded-full animate-bounce text-sm text-center">
        <span id="msgIconContainer" class="shrink-0 flex items-center justify-center">
          <i data-lucide="info" class="w-[18px] h-[18px]"></i>
        </span>
        <span id="msgText">準備好開始了嗎！</span>
      </div>
    </div>

    <!-- 輸入區與送出按鈕 -->
    <form id="wordForm" class="relative mb-6">
      <input
        id="wordInput"
        type="text"
        placeholder="請輸入英文單字..."
        autocomplete="off"
        class="w-full text-center text-2xl font-bold p-4 rounded-full border-4 outline-none transition-colors border-[#E8EAED]"
      />
      <button
        id="submitBtn"
        type="submit"
        class="absolute right-2 top-2 bottom-2 aspect-square rounded-full flex items-center justify-center text-white transition-transform active-scale bg-[#34A853]"
      >
        <span id="submitIconContainer" class="flex items-center justify-center">
          <i data-lucide="send" class="w-6 h-6 ml-1"></i>
        </span>
      </button>
    </form>

    <!-- 動作按鈕區 (跳過 & 提示) -->
    <div class="flex justify-between items-center border-b-2 border-gray-100 pb-6 mb-4 px-2">
      <button
        id="skipBtn"
        class="flex items-center space-x-2 text-gray-400 hover:text-gray-700 font-bold px-4 py-2 rounded-full hover:bg-gray-100 transition-colors active-scale"
      >
        <i data-lucide="refresh-cw" class="w-[18px] h-[18px]"></i>
        <span>換一題</span>
      </button>

      <button
        id="hintBtn"
        class="flex items-center space-x-2 font-bold px-4 py-2 rounded-full transition-colors text-[#E37400] bg-[#FEF7E0] hover:bg-[#FCE8B2] shadow-sm active-scale"
      >
        <i id="hintIcon" data-lucide="lightbulb" class="w-[18px] h-[18px] text-[#FBBC05]"></i>
        <span id="hintText">提示 (3)</span>
      </button>
    </div>

    <!-- 歷史單字紀錄 -->
    <div class="h-32 overflow-y-auto pr-2 custom-scrollbar">
      <p id="historyCount" class="text-xs text-gray-400 font-bold mb-2 flex items-center">
        已找到的單字 (0) - 點擊發音
      </p>
      <div id="historyList" class="flex flex-wrap gap-2">
        <span class="text-gray-300 text-sm" id="emptyHistoryMsg">還沒有找到單字喔，快來試試！</span>
      </div>
    </div>
  </div>

  <script>
    // === 常數與變數設定 ===
    const GOOGLE_COLORS = ['#4285F4', '#EA4335', '#FBBC05', '#34A853'];
    const LETTER_PAIRS = [
      ['a', 't'], ['a', 'e'], ['b', 'd'], ['b', 't'], ['c', 't'], ['c', 'e'],
      ['d', 'g'], ['d', 'y'], ['e', 'd'], ['e', 'e'], ['f', 't'], ['f', 'y'],
      ['g', 'd'], ['g', 't'], ['h', 't'], ['h', 'e'], ['i', 'n'], ['i', 'e'],
      ['j', 'y'], ['k', 'y'], ['l', 'y'], ['l', 'e'], ['m', 'n'], ['m', 'e'],
      ['n', 't'], ['n', 'e'], ['o', 't'], ['o', 'e'], ['p', 'r'], ['p', 'e'],
      ['r', 't'], ['r', 'e'], ['s', 't'], ['s', 'e'], ['t', 't'], ['t', 'e'],
      ['u', 's'], ['w', 'y'], ['w', 'd']
    ];

    let currentPair = ['a', 't'];
    let score = 0;
    let hintsLeft = 3;
    let wordsFound = []; // 儲存 { word: 'xxx', zh: 'xxx' }
    let isProcessing = false;

    // === DOM 元素取得 ===
    const els = {
      score: document.getElementById('scoreDisplay'),
      firstL: document.getElementById('firstLetter'),
      lastL: document.getElementById('lastLetter'),
      wordBlocks: document.getElementById('wordBlocks'),
      msgBox: document.getElementById('messageBox'),
      msgIconContainer: document.getElementById('msgIconContainer'),
      msgText: document.getElementById('msgText'),
      form: document.getElementById('wordForm'),
      input: document.getElementById('wordInput'),
      submitBtn: document.getElementById('submitBtn'),
      submitIconContainer: document.getElementById('submitIconContainer'),
      skipBtn: document.getElementById('skipBtn'),
      hintBtn: document.getElementById('hintBtn'),
      hintText: document.getElementById('hintText'),
      historyCount: document.getElementById('historyCount'),
      historyList: document.getElementById('historyList'),
      emptyHistoryMsg: document.getElementById('emptyHistoryMsg')
    };

    // 初始化 Lucide Icons
    lucide.createIcons();

    // === 核心功能 ===

    // 1. 初始化與取得新題目
    function getNewPair() {
      const randomPair = LETTER_PAIRS[Math.floor(Math.random() * LETTER_PAIRS.length)];
      currentPair = randomPair;
      
      els.firstL.textContent = currentPair[0].toUpperCase();
      els.lastL.textContent = currentPair[1].toUpperCase();
      els.input.value = '';
      els.wordBlocks.classList.remove('scale-110');
      
      setProcessState(false);
      showMessage('請輸入符合的單字！', 'info');
      els.input.focus();
    }

    // 2. 顯示訊息
    function showMessage(text, type) {
      els.msgBox.classList.remove('hidden');
      els.msgText.textContent = text;
      
      // 重置樣式
      els.msgBox.className = "flex items-center space-x-2 font-bold px-4 py-2 rounded-full animate-bounce text-sm text-center";
      els.input.style.borderColor = "#E8EAED";
      
      if (type === 'error') {
        els.msgBox.classList.add('bg-[#FCE8E6]', 'text-[#EA4335]');
        els.input.style.borderColor = "#EA4335";
        els.msgIconContainer.innerHTML = '<i data-lucide="alert-circle" class="w-[18px] h-[18px]"></i>';
      } else if (type === 'success') {
        els.msgBox.classList.add('bg-[#CEEAD6]', 'text-[#34A853]');
        els.input.style.borderColor = "#34A853";
        els.msgIconContainer.innerHTML = '<i data-lucide="star" class="w-[18px] h-[18px]"></i>';
      } else { // info
        els.msgBox.classList.add('bg-[#E8F0FE]', 'text-[#4285F4]');
        els.msgIconContainer.innerHTML = '<i data-lucide="info" class="w-[18px] h-[18px]"></i>';
      }
      lucide.createIcons();
    }

    // 4. 設定處理狀態 (禁用按鈕)
    function setProcessState(processing) {
      isProcessing = processing;
      els.input.disabled = processing;
      els.submitBtn.disabled = processing;
      els.skipBtn.disabled = processing;
      
      if (hintsLeft > 0) {
        els.hintBtn.disabled = processing;
      }

      if (processing) {
        els.submitIconContainer.innerHTML = '<i data-lucide="refresh-cw" class="w-6 h-6 animate-spin"></i>';
        els.submitBtn.classList.add('opacity-50');
      } else {
        els.submitIconContainer.innerHTML = '<i data-lucide="send" class="w-6 h-6 ml-1"></i>';
        els.submitBtn.classList.remove('opacity-50');
      }
      lucide.createIcons();
    }

    // 5. 語音發音
    function speakWord(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    // === 事件處理 ===

    // 送出表單
    els.form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isProcessing) return;

      const word = els.input.value.trim().toLowerCase();
      if (!word) return;

      // 基礎驗證
      if (word.length < 2) {
        return showMessage('單字太短囉！至少要 2 個字母。', 'error');
      }
      if (word[0] !== currentPair[0] || word[word.length - 1] !== currentPair[1]) {
        return showMessage(`必須以 ${currentPair[0].toUpperCase()} 開頭，${currentPair[1].toUpperCase()} 結尾！`, 'error');
      }
      if (wordsFound.some(w => w.word === word)) {
        return showMessage('這個字已經拼過囉！換一個吧。', 'error');
      }

      setProcessState(true);
      showMessage('檢查字典中...', 'info');

      try {
        // 1. 檢查英文字典
        const res = await fetch(`https://api.datamuse.com/words?sp=${word}&max=1`);
        const data = await res.json();

        if (data.length > 0 && data[0].word === word) {
          
          // 2. 查翻譯 (改用更穩定的 Google Translate API)
          showMessage('翻譯中...', 'info');
          let zhTranslation = "無翻譯";
          try {
            const transRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${word}`);
            const transData = await transRes.json();
            if (transData && transData[0] && transData[0][0] && transData[0][0][0]) {
              zhTranslation = transData[0][0][0];
              // 如果翻譯出來還是原本的英文字，就判定為無翻譯
              if (zhTranslation.toLowerCase() === word.toLowerCase()) {
                zhTranslation = "無翻譯";
              }
            }
          } catch (e) { console.warn("翻譯失敗", e); }

          // 3. 答對處理
          const points = word.length * 10;
          score += points;
          els.score.textContent = `${score} 分`;
          
          wordsFound.unshift({ word, zh: zhTranslation });
          updateHistoryUI();

          showMessage(`🎉 +${points}分！ ${word} (${zhTranslation})`, 'success');
          els.wordBlocks.classList.add('scale-110');
          speakWord(word);
          
          setTimeout(() => {
            getNewPair();
          }, 2500);

        } else {
          showMessage('字典裡找不到這個字喔 🤔', 'error');
          setProcessState(false);
          els.input.focus();
        }
      } catch (err) {
        showMessage('網路錯誤，請再試一次。', 'error');
        setProcessState(false);
      }
    });

    // 跳過
    els.skipBtn.addEventListener('click', () => {
      showMessage('跳過這題啦！', 'info');
      getNewPair();
    });

    // 提示
    els.hintBtn.addEventListener('click', async () => {
      if (hintsLeft <= 0 || isProcessing) return;
      
      setProcessState(true);
      showMessage('尋找靈感中...', 'info');

      try {
        const res = await fetch(`https://api.datamuse.com/words?sp=${currentPair[0]}*${currentPair[1]}&max=50`);
        const data = await res.json();
        
        const validWords = data.filter(item => 
          !wordsFound.some(w => w.word === item.word) &&
          item.word.length >= 2 &&
          /^[a-z]+$/.test(item.word)
        );

        if (validWords.length > 0) {
          const randomWord = validWords[Math.floor(Math.random() * validWords.length)].word;
          els.input.value = randomWord;
          
          hintsLeft--;
          els.hintText.textContent = `提示 (${hintsLeft})`;
          
          if (hintsLeft <= 0) {
            // 禁用提示按鈕樣式
            els.hintBtn.className = "flex items-center space-x-2 font-bold px-4 py-2 rounded-full transition-colors text-gray-400 bg-gray-100 cursor-not-allowed";
            const currentHintIcon = document.querySelector('#hintBtn svg');
            if (currentHintIcon) currentHintIcon.classList.remove('text-[#FBBC05]');
          }
          
          showMessage('試試看這個單字！(直接送出即可)', 'success');
        } else {
          showMessage('這題好像沒有更多單字了，請跳過！', 'error');
        }
      } catch (err) {
        showMessage('網路錯誤，無法取得提示。', 'error');
      }
      
      setProcessState(false);
      els.input.focus();
    });

    // 更新歷史紀錄 UI
    function updateHistoryUI() {
      els.historyCount.textContent = `已找到的單字 (${wordsFound.length}) - 點擊發音`;
      if (els.emptyHistoryMsg) els.emptyHistoryMsg.remove();
      
      els.historyList.innerHTML = '';
      
      wordsFound.forEach((item, index) => {
        const bgColor = GOOGLE_COLORS[index % GOOGLE_COLORS.length];
        
        const btn = document.createElement('button');
        btn.className = 'flex items-center space-x-1 text-white text-sm px-3 py-1.5 rounded-full shadow-sm hover:opacity-85 transition-opacity active-scale';
        btn.style.backgroundColor = bgColor;
        btn.title = '點擊聽發音';
        btn.onclick = () => speakWord(item.word);

        let innerHTML = `<span class="font-bold">${item.word}</span>`;
        if (item.zh && item.zh !== "無翻譯") {
          innerHTML += `<span class="text-xs opacity-90 border-l border-white/30 pl-1 ml-1">${item.zh}</span>`;
        }
        // 插入小喇叭圖示 (Lucide)
        innerHTML += `<i data-lucide="volume-2" class="w-[14px] h-[14px] ml-1 opacity-80"></i>`;
        
        btn.innerHTML = innerHTML;
        els.historyList.appendChild(btn);
      });
      
      // 重新渲染新加入的 icon
      lucide.createIcons();
    }

    // 啟動遊戲
    window.onload = getNewPair;

  </script>
</body>
</html>
