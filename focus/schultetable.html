<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡皮巴拉不規則舒爾特方格</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FFFDF0; /* 淨春型：鵝黃底色 */
            touch-action: manipulation;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #FFC4C4; border-radius: 10px; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px) rotate(-3deg); }
            40%, 80% { transform: translateX(5px) rotate(3deg); }
        }
        .shake-animation {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            background-color: #FF8A8A !important;
            color: white !important;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .schulte-cell {
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 rgba(0,0,0,0.1);
        }
        .schulte-cell:active:not(.found) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }
        .schulte-cell.found {
            opacity: 0.4;
            transform: scale(0.95);
            box-shadow: none;
            pointer-events: none;
            filter: grayscale(50%);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .capybara-float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-6 px-4">

    <div id="menu-screen" class="flex flex-col items-center justify-center w-full max-w-lg z-10 flex-1 transition-opacity duration-300">
        <svg class="w-40 h-40 capybara-float mb-4 drop-shadow-xl" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect x="15" y="40" width="70" height="45" rx="22" fill="#9C6B30"/>
            <circle cx="25" cy="40" r="8" fill="#754D20"/>
            <circle cx="75" cy="40" r="8" fill="#754D20"/>
            <line x1="30" y1="55" x2="45" y2="55" stroke="#3E2723" stroke-width="4" stroke-linecap="round"/>
            <line x1="70" y1="55" x2="55" y2="55" stroke="#3E2723" stroke-width="4" stroke-linecap="round"/>
            <path d="M 45 68 Q 50 74 55 68" stroke="#3E2723" stroke-width="4" fill="none" stroke-linecap="round"/>
            <circle cx="50" cy="62" r="3.5" fill="#3E2723"/>
            <circle cx="50" cy="25" r="12" fill="#FF9800"/>
            <path d="M 50 13 Q 55 5 60 10" stroke="#4CAF50" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>

        <h1 class="text-4xl md:text-5xl font-black text-[#5C4033] tracking-wider drop-shadow-sm mb-2 text-center">舒爾特方格</h1>
        <p class="text-[#8B5A2B] font-bold mb-8 text-center text-lg">水豚的專注力考驗 🍊</p>

        <div class="flex flex-col gap-4 w-full px-4">
            <div class="bg-white/60 p-4 rounded-2xl shadow-sm mb-2 border border-white">
                <p class="text-center font-bold text-[#754D20] mb-3 text-sm">經典規則排列</p>
                <div class="flex gap-2">
                    <button onclick="startGame(16, 'regular')" class="flex-1 bg-[#A7E8D0] hover:bg-[#85d8ba] text-[#215A43] font-black py-3 px-2 rounded-xl shadow-[0_4px_0_#75BFA2] active:shadow-[0_0px_0_#75BFA2] active:translate-y-[4px] transition-all text-sm md:text-base flex items-center justify-center gap-1">
                        <span class="text-lg">🌱</span> 3x3 (9格)
                    </button>
                    <button onclick="startGame(25, 'regular')" class="flex-1 bg-[#A7E8D0] hover:bg-[#85d8ba] text-[#215A43] font-black py-3 px-2 rounded-xl shadow-[0_4px_0_#75BFA2] active:shadow-[0_0px_0_#75BFA2] active:translate-y-[4px] transition-all text-sm md:text-base flex items-center justify-center gap-1">
                        <span class="text-lg">🌿</span> 4x4 (16格)
                    </button>
                    <button onclick="startGame(25, 'regular', true)" class="flex-1 bg-[#FFC4C4] hover:bg-[#ffadad] text-[#7D3232] font-black py-3 px-2 rounded-xl shadow-[0_4px_0_#D99696] active:shadow-[0_0px_0_#D99696] active:translate-y-[4px] transition-all text-sm md:text-base flex items-center justify-center gap-1">
                        <span class="text-lg">🔥</span> 5x5 (25格)
                    </button>
                </div>
            </div>

            <div class="bg-white/60 p-4 rounded-2xl shadow-sm border border-white">
                <p class="text-center font-bold text-[#754D20] mb-3 text-sm">趣味不規則排列</p>
                <div class="flex gap-2">
                    <button onclick="startGame(16, 'irregular')" class="flex-1 bg-[#FFF099] hover:bg-[#ffeb66] text-[#756819] font-black py-3 px-4 rounded-xl shadow-[0_4px_0_#D1C266] active:shadow-[0_0px_0_#D1C266] active:translate-y-[4px] transition-all text-sm md:text-base flex items-center justify-center gap-2">
                        <span class="text-xl">✨</span> 基礎 (16)
                    </button>
                    <button onclick="startGame(25, 'irregular')" class="flex-1 bg-[#FFD1A9] hover:bg-[#ffb97b] text-[#824E24] font-black py-3 px-4 rounded-xl shadow-[0_4px_0_#d9a076] active:shadow-[0_0px_0_#d9a076] active:translate-y-[4px] transition-all text-sm md:text-base flex items-center justify-center gap-2">
                        <span class="text-xl">🌟</span> 挑戰 (25)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="game-screen" class="hidden w-full flex-col items-center w-full relative">
        <header class="w-full max-w-3xl flex flex-col items-center mb-6 relative z-10">
            <div class="flex items-center gap-2 mb-4">
                <svg class="w-8 h-8 capybara-float" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <rect x="15" y="40" width="70" height="45" rx="22" fill="#9C6B30"/>
                    <circle cx="25" cy="40" r="8" fill="#754D20"/>
                    <circle cx="75" cy="40" r="8" fill="#754D20"/>
                    <circle cx="50" cy="25" r="12" fill="#FF9800"/>
                </svg>
                <h2 id="mode-title" class="text-2xl font-black text-[#5C4033]">模式</h2>
            </div>
            
            <!-- 控制面板 -->
            <div class="bg-white/70 backdrop-blur-md p-4 rounded-3xl shadow-lg flex flex-wrap justify-center items-center gap-4 md:gap-8 w-full max-w-lg border-2 border-white">
                <div class="flex flex-col items-center min-w-[60px]">
                    <span class="text-xs md:text-sm text-gray-500 font-bold uppercase tracking-widest">找尋</span>
                    <div id="next-target" class="text-3xl md:text-4xl font-black text-rose-500 w-12 text-center">1</div>
                </div>
                
                <div class="w-px h-10 bg-gray-300"></div>

                <div class="flex flex-col items-center min-w-[100px]">
                    <span class="text-xs md:text-sm text-gray-500 font-bold uppercase tracking-widest">時間</span>
                    <div id="timer" class="text-2xl md:text-3xl font-black text-[#5C4033] tabular-nums">00:00.00</div>
                </div>

                <button onclick="backToMenu()" class="bg-[#FFF099] hover:bg-[#ffeb66] text-[#756819] font-black py-2 px-4 rounded-xl shadow-[0_4px_0_#D1C266] active:shadow-[0_0px_0_#D1C266] active:translate-y-[4px] transition-all text-sm md:text-base">
                    返回選單
                </button>
            </div>
        </header>

        <main class="w-full relative">
            <!-- 網格容器 (寬度與欄位會透過 JS 動態設定) -->
            <div id="grid-container" class="grid auto-rows-[80px] md:auto-rows-[100px] grid-flow-dense p-2 mx-auto transition-all duration-300">
                <!-- 方塊動態生成 -->
            </div>
        </main>
    </div>

    <div id="win-modal" class="fixed inset-0 bg-[#5C4033]/40 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-[40px] p-8 max-w-sm w-11/12 text-center shadow-2xl transform scale-90 transition-transform duration-300 border-8 border-[#FFF099] relative" id="win-modal-content">
            
            <div class="absolute -top-16 left-1/2 transform -translate-x-1/2">
                <svg class="w-32 h-32 capybara-float drop-shadow-xl" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <rect x="15" y="30" width="70" height="60" rx="30" fill="#9C6B30"/>
                    <circle cx="25" cy="25" r="10" fill="#754D20"/>
                    <circle cx="75" cy="25" r="10" fill="#754D20"/>
                    <path d="M 30 50 Q 40 45 45 50" stroke="#3E2723" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M 70 50 Q 60 45 55 50" stroke="#3E2723" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M 40 70 Q 50 80 60 70" stroke="#3E2723" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <circle cx="50" cy="60" r="5" fill="#3E2723"/>
                    <circle cx="25" cy="65" r="8" fill="#FFB5A7" opacity="0.6"/>
                    <circle cx="75" cy="65" r="8" fill="#FFB5A7" opacity="0.6"/>
                </svg>
            </div>

            <h2 class="text-4xl font-black text-[#FF8A8A] mt-12 mb-2">太棒了！</h2>
            <p class="text-[#8B5A2B] font-bold text-lg mb-4">你完成了水豚的考驗 🍊</p>
            
            <div class="bg-[#FFFDF0] rounded-2xl p-4 mb-4 border-2 border-dashed border-[#A7E8D0]">
                <p class="text-gray-500 text-sm font-bold">你的成績</p>
                <p id="final-time" class="text-4xl font-black text-[#2c5d4b] tabular-nums mt-1 mb-2">00:00.00</p>
                <div class="inline-flex items-center justify-center bg-white px-4 py-2 rounded-full shadow-inner border border-gray-100">
                    <span id="rank-display" class="text-2xl font-black mr-2">S</span>
                    <span id="rank-message" class="text-sm font-bold text-gray-600">完美專注力！</span>
                </div>
            </div>

            <div class="flex gap-3">
                <button onclick="backToMenu()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-black py-4 px-2 rounded-2xl shadow-[0_5px_0_#9ca3af] active:shadow-[0_0px_0_#9ca3af] active:translate-y-[5px] transition-all text-lg">
                    回選單
                </button>
                <button onclick="restartCurrentMode()" class="flex-[2] bg-[#FFC4C4] hover:bg-[#ffadad] text-[#8c3a3a] font-black py-4 px-2 rounded-2xl shadow-[0_5px_0_#df8a8a] active:shadow-[0_0px_0_#df8a8a] active:translate-y-[5px] transition-all text-lg">
                    再來一次！
                </button>
            </div>
        </div>
    </div>

    <script>
        // 遊戲狀態與新功能資料
        let currentTotalNumbers = 25;
        let currentLayout = 'irregular'; 
        let currentTarget = 1;
        let isPlaying = false;
        let startTime = 0;
        let timerInterval = null;

        // 貨幣與主題系統
        let coins = parseInt(localStorage.getItem('schulteCoins') || '0');
        let unlockedThemes = JSON.parse(localStorage.getItem('schulteThemes') || '["default"]');
        let currentTheme = localStorage.getItem('schulteCurrentTheme') || 'default';
        let currentCharSet = 'numbers';

        // 字元替換包設定
        const CHAR_SETS = {
            numbers: Array.from({length: 25}, (_, i) => (i + 1).toString()),
            alphabets: Array.from({length: 25}, (_, i) => String.fromCharCode(65 + i)),
            bopomofo: ['ㄅ','ㄆ','ㄇ','ㄈ','ㄉ','ㄊ','ㄋ','ㄌ','ㄍ','ㄎ','ㄏ','ㄐ','ㄑ','ㄒ','ㄓ','ㄔ','ㄕ','ㄖ','ㄗ','ㄘ','ㄙ','ㄧ','ㄨ','ㄩ','ㄚ']
        };

        // 主題資料
        const THEMES = {
            default: { id: 'default', name: '淨春水豚 (預設)', bg: '#FFFDF0', cost: 0, icon: '🍊' },
            ocean: { id: 'ocean', name: '深海藍', bg: '#E0F2FE', cost: 30, icon: '🌊' },
            space: { id: 'space', name: '星空紫', bg: '#F3E8FF', cost: 60, icon: '🌌' },
            forest: { id: 'forest', name: '森林綠', bg: '#ECFDF5', cost: 100, icon: '🌲' }
        };

        // DOM 元素
        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');
        const gridContainer = document.getElementById('grid-container');
        const timerDisplay = document.getElementById('timer');
        const nextTargetDisplay = document.getElementById('next-target');
        const modeTitle = document.getElementById('mode-title');
        const winModal = document.getElementById('win-modal');
        const winModalContent = document.getElementById('win-modal-content');
        const finalTimeDisplay = document.getElementById('final-time');
        const rankDisplay = document.getElementById('rank-display');
        const rankMessage = document.getElementById('rank-message');
        const shopModal = document.getElementById('shop-modal');
        const shopModalContent = document.getElementById('shop-modal-content');
        
        // 初始化金幣與主題
        document.getElementById('coin-count').textContent = coins;
        document.getElementById('main-body').style.backgroundColor = THEMES[currentTheme].bg;

        // 淨春型視覺設定池 (Clear Spring Palette)
        const visualPool = {
            colors: [
                { bg: 'bg-[#A7E8D0]', text: 'text-[#215A43]' }, // 薄荷綠
                { bg: 'bg-[#FFC4C4]', text: 'text-[#7D3232]' }, // 蜜桃粉
                { bg: 'bg-[#AEE1FF]', text: 'text-[#2D5A7A]' }, // 天青藍
                { bg: 'bg-[#FFF099]', text: 'text-[#756819]' }, // 鵝黃
                { bg: 'bg-[#E2D4FF]', text: 'text-[#534080]' }, // 薰衣草
                { bg: 'bg-[#FFD1A9]', text: 'text-[#824E24]' }  // 珊瑚橘
            ],
            spans: [
                'col-span-1 row-span-1', 'col-span-1 row-span-1', 'col-span-1 row-span-1', 
                'col-span-2 row-span-1', 'col-span-1 row-span-2', 'col-span-1 row-span-1'
            ],
            sizes: ['text-3xl', 'text-4xl', 'text-5xl', 'text-2xl'],
            radius: ['rounded-2xl', 'rounded-3xl', 'rounded-[2rem]']
        };

        // 工具函式：洗牌
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 工具函式：隨機取值
        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // 時間格式化
        function formatTime(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            const milliseconds = Math.floor((ms % 1000) / 10);
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${milliseconds.toString().padStart(2, '0')}`;
        }

        function updateTimer() {
            const elapsedTime = Date.now() - startTime;
            timerDisplay.textContent = formatTime(elapsedTime);
        }

        function renderBoard() {
            gridContainer.innerHTML = '';
            gridContainer.className = ''; // 重置 class
            
            // 決定格數：如果是 9 格，只取 1-9
            let targetNumbers = currentTotalNumbers === 9 ? 9 : (currentTotalNumbers === 16 ? 16 : 25);
            
            if (currentLayout === 'regular') {
                // 規則排列設定
                if (targetNumbers === 9) {
                    gridContainer.className = 'grid grid-cols-3 gap-2 p-2 w-full max-w-[320px] aspect-square mx-auto';
                } else if (targetNumbers === 16) {
                    gridContainer.className = 'grid grid-cols-4 gap-2 p-2 w-full max-w-[400px] aspect-square mx-auto';
                } else {
                    gridContainer.className = 'grid grid-cols-5 gap-2 p-2 w-full max-w-[500px] aspect-square mx-auto';
                }
            } else {
                // 不規則瀑布流設定
                if (targetNumbers === 16) {
                    gridContainer.className = 'grid grid-cols-3 md:grid-cols-4 gap-3 md:gap-4 auto-rows-[80px] md:auto-rows-[100px] grid-flow-dense p-2 w-full max-w-2xl mx-auto transition-all duration-300';
                } else {
                    gridContainer.className = 'grid grid-cols-3 md:grid-cols-5 lg:grid-cols-6 gap-3 md:gap-4 auto-rows-[80px] md:auto-rows-[100px] grid-flow-dense p-2 w-full max-w-4xl mx-auto transition-all duration-300';
                }
            }

            let numbers = Array.from({ length: targetNumbers }, (_, i) => i + 1);
            numbers = shuffleArray(numbers);

            let largeBlocksCount = 0;
            const maxLargeBlocks = targetNumbers === 16 ? 3 : (window.innerWidth < 768 ? 4 : 8);

            numbers.forEach((num, index) => {
                const btn = document.createElement('button');
                btn.dataset.number = num; // 保留原始數字作為判定依據
                btn.textContent = CHAR_SETS[currentCharSet][num - 1]; // 顯示字元包對應內容

                if (currentLayout === 'regular') {
                    // 規則模式：統一的外觀
                    btn.className = `schulte-cell flex items-center justify-center font-black pop-in border-2 border-[#E2D4FF]
                                    bg-white hover:bg-gray-50 text-[#5C4033] 
                                    col-span-1 row-span-1 text-2xl md:text-3xl rounded-xl
                                    relative overflow-hidden select-none shadow-sm`;
                } else {
                    // 不規則模式：隨機外觀與大小
                    const colorObj = getRandom(visualPool.colors);
                    let spanClass = getRandom(visualPool.spans);
                    const sizeClass = getRandom(visualPool.sizes);
                    const radiusClass = getRandom(visualPool.radius);

                    if (spanClass !== 'col-span-1 row-span-1') {
                        if (largeBlocksCount >= maxLargeBlocks || (window.innerWidth < 768 && spanClass.includes('col-span-2'))) {
                            spanClass = 'col-span-1 row-span-1';
                        } else {
                            largeBlocksCount++;
                        }
                    }

                    btn.className = `schulte-cell flex items-center justify-center font-black pop-in border-4 border-white/50
                                    ${colorObj.bg} ${colorObj.text} 
                                    ${spanClass} ${sizeClass} ${radiusClass}
                                    relative overflow-hidden select-none`;
                    btn.innerHTML += `<div class="absolute inset-0 bg-gradient-to-tr from-white/0 via-white/20 to-white/0 pointer-events-none"></div>`;
                }
                
                btn.style.animationDelay = `${index * 0.02}s`;
                btn.addEventListener('click', handleCellClick);
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); handleCellClick.call(btn); }, {passive: false});

                gridContainer.appendChild(btn);
            });
            
            // 修正總數變數，以防傳入 25 但想玩 9 的情況 (按鈕參數設定)
            currentTotalNumbers = targetNumbers;
        }

        function handleCellClick() {
            if (!isPlaying) return;
            
            const clickedNumber = parseInt(this.dataset.number);

            if (clickedNumber === currentTarget) {
                this.classList.add('found');
                
                const checkMark = document.createElement('div');
                checkMark.innerHTML = '✔';
                checkMark.className = 'absolute text-4xl text-white drop-shadow-md';
                this.appendChild(checkMark);

                currentTarget++;
                
                if (currentTarget > currentTotalNumbers) {
                    endGame();
                } else {
                    // 更新找尋目標的顯示文字
                    nextTargetDisplay.textContent = CHAR_SETS[currentCharSet][currentTarget - 1];
                    nextTargetDisplay.classList.remove('pop-in');
                    void nextTargetDisplay.offsetWidth;
                    nextTargetDisplay.classList.add('pop-in');
                }
            } else {
                this.classList.remove('shake-animation');
                void this.offsetWidth;
                this.classList.add('shake-animation');
                
                setTimeout(() => {
                    this.classList.remove('shake-animation');
                }, 400);
            }
        }

        function startGame(totalNumbers, layout = 'irregular', isFiveByFiveRegular = false) {
            // 處理 3x3 規則模式的特例
            if (layout === 'regular' && totalNumbers === 16 && !isFiveByFiveRegular && event && event.target.innerText.includes('3x3')) {
                currentTotalNumbers = 9;
            } else if (layout === 'regular' && totalNumbers === 25 && !isFiveByFiveRegular) {
                 currentTotalNumbers = 16;
            } else if (layout === 'regular' && isFiveByFiveRegular){
                 currentTotalNumbers = 25;
            } else {
                currentTotalNumbers = totalNumbers;
            }

            currentLayout = layout;
            
            let modeName = layout === 'regular' ? '規則模式' : '不規則模式';
            modeTitle.textContent = `${modeName} (${currentTotalNumbers})`;
            
            menuScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            gameScreen.classList.add('flex');
            
            // 重置狀態
            isPlaying = true;
            currentTarget = 1;
            // 根據字元包顯示第一個目標
            nextTargetDisplay.textContent = CHAR_SETS[currentCharSet][0];
            timerDisplay.textContent = "00:00.00";
            
            closeModal();
            renderBoard();

            // 啟動計時器
            clearInterval(timerInterval);
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 30);
        }

        function calculateRank(totalTimeMs) {
            const timeInSeconds = totalTimeMs / 1000;
            // 這些標準設定較為寬鬆，以鼓勵為主
            // 可以根據學生的實際平均表現來調整
            let rank, message, colorClass;

            if (currentTotalNumbers === 9) {
                if (timeInSeconds <= 10) { rank = 'S'; message = '神乎其技！'; colorClass = 'text-[#FF8A8A]'; }
                else if (timeInSeconds <= 15) { rank = 'A'; message = '極度專注！'; colorClass = 'text-[#FF9800]'; }
                else if (timeInSeconds <= 20) { rank = 'B'; message = '表現很棒！'; colorClass = 'text-[#4CAF50]'; }
                else { rank = 'C'; message = '漸入佳境，繼續保持！'; colorClass = 'text-[#2196F3]'; }
            } else if (currentTotalNumbers === 16) {
                if (timeInSeconds <= 20) { rank = 'S'; message = '神乎其技！'; colorClass = 'text-[#FF8A8A]'; }
                else if (timeInSeconds <= 30) { rank = 'A'; message = '極度專注！'; colorClass = 'text-[#FF9800]'; }
                else if (timeInSeconds <= 45) { rank = 'B'; message = '表現很棒！'; colorClass = 'text-[#4CAF50]'; }
                else { rank = 'C'; message = '穩紮穩打，再來一次！'; colorClass = 'text-[#2196F3]'; }
            } else { // 25
                if (timeInSeconds <= 35) { rank = 'S'; message = '鷹眼水豚！'; colorClass = 'text-[#FF8A8A]'; }
                else if (timeInSeconds <= 55) { rank = 'A'; message = '注意力超群！'; colorClass = 'text-[#FF9800]'; }
                else if (timeInSeconds <= 80) { rank = 'B'; message = '很有潛力喔！'; colorClass = 'text-[#4CAF50]'; }
                else { rank = 'C'; message = '水豚為你加油！'; colorClass = 'text-[#2196F3]'; }
            }

            return { rank, message, colorClass };
        }

        function restartCurrentMode() {
            startGame(currentTotalNumbers, currentLayout, currentTotalNumbers === 25 && currentLayout === 'regular');
        }

        function backToMenu() {
            isPlaying = false;
            clearInterval(timerInterval);
            closeModal();
            
            // 切換回主選單
            gameScreen.classList.add('hidden');
            gameScreen.classList.remove('flex');
            menuScreen.classList.remove('hidden');
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            const totalTime = Date.now() - startTime;
            finalTimeDisplay.textContent = formatTime(totalTime);
            
            // 設定評價
            const eval = calculateRank(totalTime);
            rankDisplay.textContent = eval.rank;
            rankDisplay.className = `text-3xl font-black mr-2 ${eval.colorClass}`;
            rankMessage.textContent = eval.message;
            
            // 計算獲得金幣
            let earnedCoins = 0;
            if (eval.rank === 'S') earnedCoins = 5;
            else if (eval.rank === 'A') earnedCoins = 3;
            else if (eval.rank === 'B') earnedCoins = 1;
            
            if (earnedCoins > 0) {
                coins += earnedCoins;
                localStorage.setItem('schulteCoins', coins);
                document.getElementById('coin-count').textContent = coins;
            }
            document.getElementById('earned-coins').textContent = `+${earnedCoins} 金幣`;

            // 隱藏彩蛋：S級觸發彩紙與皇冠
            const crown = document.getElementById('capybara-crown');
            if (eval.rank === 'S') {
                crown.classList.remove('hidden');
                void crown.offsetWidth; // 強制重繪
                crown.classList.add('crown-animate');
                triggerConfetti();
            } else {
                crown.classList.add('hidden');
                crown.classList.remove('crown-animate');
            }
            
            // 顯示過關畫面
            winModal.classList.remove('pointer-events-none', 'opacity-0');
            setTimeout(() => {
                winModalContent.classList.remove('scale-90');
                winModalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            winModal.classList.add('opacity-0', 'pointer-events-none');
            winModalContent.classList.remove('scale-100');
            winModalContent.classList.add('scale-90');
        }

        // 商店系統與主題邏輯
        function openShop() {
            document.getElementById('shop-coin-display').textContent = coins;
            const shopItems = document.getElementById('shop-items');
            shopItems.innerHTML = '';

            Object.values(THEMES).forEach(theme => {
                const isUnlocked = unlockedThemes.includes(theme.id);
                const isEquipped = currentTheme === theme.id;
                
                const card = document.createElement('div');
                card.className = `theme-card p-4 rounded-xl border-2 flex flex-col items-center gap-2 ${isEquipped ? 'border-[#4CAF50] bg-[#ECFDF5]' : 'border-gray-200 bg-white'}`;
                
                let btnHtml = '';
                if (isEquipped) {
                    btnHtml = `<button disabled class="w-full py-2 rounded-lg bg-gray-200 text-gray-500 font-bold text-sm">裝備中</button>`;
                } else if (isUnlocked) {
                    btnHtml = `<button onclick="equipTheme('${theme.id}')" class="w-full py-2 rounded-lg bg-[#A7E8D0] hover:bg-[#85d8ba] text-[#215A43] font-bold text-sm shadow-[0_3px_0_#75BFA2] active:translate-y-[3px] active:shadow-none transition-all">裝備</button>`;
                } else {
                    const canAfford = coins >= theme.cost;
                    btnHtml = `<button onclick="buyTheme('${theme.id}')" class="w-full py-2 rounded-lg ${canAfford ? 'bg-[#FFD1A9] hover:bg-[#ffb97b] text-[#824E24] shadow-[0_3px_0_#d9a076]' : 'bg-gray-100 text-gray-400 cursor-not-allowed'} font-bold text-sm active:translate-y-[3px] active:shadow-none transition-all flex justify-center items-center gap-1">
                                    <span class="text-xs">🪙</span> ${theme.cost} 解鎖
                               </button>`;
                }

                card.innerHTML = `
                    <div class="text-3xl">${theme.icon}</div>
                    <div class="font-black text-[#5C4033] text-sm">${theme.name}</div>
                    <div class="w-full h-8 rounded-md mb-1 border border-black/10" style="background-color: ${theme.bg}"></div>
                    ${btnHtml}
                `;
                shopItems.appendChild(card);
            });

            shopModal.classList.remove('pointer-events-none', 'opacity-0');
            setTimeout(() => {
                shopModalContent.classList.remove('scale-90');
                shopModalContent.classList.add('scale-100');
            }, 10);
        }

        function closeShop() {
            shopModal.classList.add('opacity-0', 'pointer-events-none');
            shopModalContent.classList.remove('scale-100');
            shopModalContent.classList.add('scale-90');
        }

        function buyTheme(themeId) {
            const theme = THEMES[themeId];
            if (coins >= theme.cost && !unlockedThemes.includes(themeId)) {
                coins -= theme.cost;
                unlockedThemes.push(themeId);
                
                localStorage.setItem('schulteCoins', coins);
                localStorage.setItem('schulteThemes', JSON.stringify(unlockedThemes));
                
                document.getElementById('coin-count').textContent = coins;
                equipTheme(themeId); // 買完直接裝備
            }
        }

        function equipTheme(themeId) {
            currentTheme = themeId;
            localStorage.setItem('schulteCurrentTheme', themeId);
            document.getElementById('main-body').style.backgroundColor = THEMES[themeId].bg;
            openShop(); // 刷新商店介面
        }

        // 彩紙特效產生器
        function triggerConfetti() {
            const colors = ['#FFC4C4', '#A7E8D0', '#FFF099', '#AEE1FF', '#E2D4FF', '#FFD1A9'];
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // 隨機大小與旋轉
                const size = Math.random() * 8 + 6;
                confetti.style.width = `${size}px`;
                confetti.style.height = `${size}px`;
                
                // 隨機掉落時間與延遲
                confetti.style.animationDuration = (Math.random() * 2.5 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 0.5) + 's';
                
                document.body.appendChild(confetti);
                
                // 動畫結束後移除 DOM
                setTimeout(() => {
                    if(document.body.contains(confetti)) confetti.remove();
                }, 5000);
            }
        }

        // 視窗縮放處理
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            if(isPlaying) {
                // 如果正在玩，視窗改變大小時稍微延遲重新渲染以適應新版面
                resizeTimer = setTimeout(() => {
                    // 為了不打斷遊戲體驗，這裡只重算大區塊配置，理想作法是保留狀態
                    // 在此簡單處理：讓 CSS 自動處理，不主動重繪 (移除 renderBoard 呼叫)
                }, 200);
            }
        });

    </script>
</body>
</html>
