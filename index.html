<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunshine Arcade | 晴光遊樂園</title>
    <!-- 已修正：加入正確的 xmlns 確保 svg 圖示能正常顯示 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='50' dominant-baseline='central' text-anchor='middle' font-size='75'>☀️</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sunshine: {
                            bg: '#18181b',       // zinc-900 柔和深底色
                            card: '#27272a',     // zinc-800 卡片底色
                            text: '#f4f4f5',     // zinc-100 文字顏色
                            muted: '#a1a1aa',    // zinc-400 次要文字
                            primary: '#fbbf24',  // amber-400 溫暖的主色
                            secondary: '#f59e0b',// amber-500
                            border: '#3f3f46'    // zinc-700 邊框顏色
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(251, 191, 36, 0.15)',
                        'glow-lg': '0 0 30px rgba(251, 191, 36, 0.3)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            overflow-x: hidden;
            background-color: #18181b; /* 強制背景色避免 CDN 延遲白頻 */
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }

        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: -1;
            background: 
                radial-gradient(circle at 15% 50%, rgba(251, 191, 36, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(245, 158, 11, 0.03) 0%, transparent 50%);
        }

        .game-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .game-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(251, 191, 36, 0.15);
            border-color: rgba(251, 191, 36, 0.4);
        }
        
        .card-img-wrapper { overflow: hidden; }
        .card-img-wrapper img {
            transition: transform 0.7s ease;
        }
        .game-card:hover .card-img-wrapper img {
            transform: scale(1.08);
        }

        .play-btn {
            opacity: 0;
            transform: translateY(20px) scale(0.9);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .game-card:hover .play-btn {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 99px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 10px 25px rgba(16,185,129,0.4);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            pointer-events: none;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        .filter-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .filter-scroll::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-sunshine-bg text-sunshine-text antialiased min-h-screen flex flex-col relative pt-[72px]">

    <div class="bg-glow"></div>

    <!-- 固定在頂部的 Navbar -->
    <nav class="fixed top-0 w-full h-[72px] px-4 md:px-8 flex justify-between items-center z-50 border-b border-white/5 bg-sunshine-bg/90 backdrop-blur-md shadow-sm gap-4">
        
        <!-- Logo 區塊 -->
        <div class="flex items-center gap-2 cursor-pointer flex-shrink-0 hover:opacity-80 transition-opacity" onclick="resetToHome()">
            <!-- 太陽圖示 -->
            <svg class="w-7 h-7 text-sunshine-primary hidden sm:block" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18.75a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-1.5a.75.75 0 01.75-.75zM6.166 17.834a.75.75 0 00-1.06 1.06l1.59 1.591a.75.75 0 101.061-1.06l-1.591-1.59zM4.5 12a.75.75 0 01-.75-.75H1.5a.75.75 0 010 1.5h2.25a.75.75 0 01.75-.75zM6.166 6.166a.75.75 0 011.06-1.06l1.591 1.59a.75.75 0 11-1.06 1.061l-1.591-1.59z" /></svg>

        <!-- 分類篩選器 -->

                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>

                <!-- 熱門關鍵字建議清單 -->

                        <li><button class="w-full text-left px-3 py-1.5 text-sm text-white hover:bg-sunshine-primary/10 hover:text-sunshine-primary transition-colors" data-keyword="數學">數學</button></li>
                    </ul>
                </div>
            </div>

            <!-- Firebase 狀態列 (已註解停用) -->
            <!--
            <div class="hidden lg:flex items-center gap-3 bg-sunshine-card/50 border border-white/5 px-4 py-1 rounded-full shadow-sm">
                <div class="flex items-center gap-2">
                    <div id="dbStatusDot" class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>

                    <span id="energyCounter" class="text-sunshine-primary font-black font-mono text-base">0</span>
                </div>
            </div>
            -->
        </div>
    </nav>

    <main class="flex-grow w-full max-w-7xl mx-auto px-4 md:px-8 pt-8 pb-24 z-10">
        <!-- 顯示筆數資訊 -->

        <!-- 社群按鈕區 -->

            <!-- 筱晴老師個人網站 -->

    <!-- Toast 提示框 -->
    <div id="toast"></div>

    <!-- 回到最上面按鈕 -->
    <button id="backToTopBtn" class="fixed bottom-8 right-8 w-12 h-12 bg-sunshine-primary text-black rounded-full shadow-[0_0_15px_rgba(251,191,36,0.3)] flex items-center justify-center opacity-0 translate-y-10 pointer-events-none transition-all duration-300 z-50 hover:bg-sunshine-secondary hover:scale-110">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" /></svg>
    </button>

    <script type="module">
        /* 暫時註解 Firebase 引入
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        */

        // 宣告空陣列，等待從 JSON 載入資料
        let myPortfolio = [];
        let currentCategory = '全部';
        let searchQuery = '';
        const categoryOrder = ['全部', '國語遊戲', '數學遊戲', '其他遊戲', '工具區'];

        // ====== 新增這段：點擊名稱回首頁並清除搜尋狀態 ======
        window.resetToHome = function() {
            currentCategory = '全部';
            searchQuery = '';
            document.getElementById('searchInput').value = '';
            
            // 重新渲染分類按鈕與卡片，並捲回頂部
            renderFilterButtons();
            updateView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        // ===================================================
        const categoryOrder = ['全部', '國語遊戲', '數學遊戲', '其他遊戲', '工具區'];

        // let currentEnergy = 0; // 註解能量變數

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            // initFirebaseMock(); // 註解能量初始化
            
            // 讀取外部 JSON 檔案
            await loadGamesData();

            // 確保資料載入後才更新畫面
            document.getElementById('gameCount').textContent = myPortfolio.length;
            renderFilterButtons();
            updateView();
            initSearchLogic();
            initBackToTop();
        });

        // 非同步讀取 JSON 的函數
        async function loadGamesData() {
            try {
                const response = await fetch('./games.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                myPortfolio = await response.json();
            } catch (error) {
                console.error("無法載入遊戲資料:", error);
                showToast("資料載入失敗，請檢查網路連線或 Local Server");
                // 發生錯誤時保持空陣列避免報錯
                myPortfolio = []; 
            }
        }

        /* 暫時註解能量系統相關功能
        function initFirebaseMock() { ... }
        window.addEnergy = function(amount, url) { ... };
        function updateEnergyDisplay(val) { ... }
        */

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function initBackToTop() {
            const btn = document.getElementById('backToTopBtn');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    btn.classList.remove('opacity-0', 'translate-y-10', 'pointer-events-none');
                    btn.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
                } else {
                    btn.classList.add('opacity-0', 'translate-y-10', 'pointer-events-none');
                    btn.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
                }
            });
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function initSearchLogic() {
            const searchBtn = document.getElementById('searchToggleBtn');
            const searchInput = document.getElementById('searchInput');
            const searchSuggestions = document.getElementById('searchSuggestions');
            const suggestionButtons = document.querySelectorAll('#suggestionList button');
            let isExpanded = false;

            // 顯示或隱藏搜尋框與關鍵字選單
            searchBtn.addEventListener('click', (e) => {
                e.stopPropagation(); // 阻止事件冒泡
                isExpanded = !isExpanded;
                if(isExpanded) {
                    searchInput.classList.remove('w-0', 'opacity-0');
                    searchInput.classList.add('w-48', 'opacity-100', 'pr-10'); 
                    searchSuggestions.classList.remove('opacity-0', 'pointer-events-none');
                    searchSuggestions.classList.add('opacity-100', 'pointer-events-auto');
                    searchInput.focus();
                } else {
                    searchInput.classList.remove('w-48', 'opacity-100', 'pr-10');
                    searchInput.classList.add('w-0', 'opacity-0');
                    searchSuggestions.classList.remove('opacity-100', 'pointer-events-auto');
                    searchSuggestions.classList.add('opacity-0', 'pointer-events-none');
                    searchInput.value = '';
                    searchQuery = '';
                    updateView();
                }
            });

            // 點擊其他地方隱藏關鍵字選單
            document.addEventListener('click', (e) => {
                if (isExpanded && !e.target.closest('.relative.flex.items-center.justify-end')) {
                    searchSuggestions.classList.remove('opacity-100', 'pointer-events-auto');
                    searchSuggestions.classList.add('opacity-0', 'pointer-events-none');
                }
            });
            
            // 點擊輸入框時再次顯示關鍵字選單
            searchInput.addEventListener('focus', () => {
                searchSuggestions.classList.remove('opacity-0', 'pointer-events-none');
                searchSuggestions.classList.add('opacity-100', 'pointer-events-auto');
            });

            // 輸入字元時更新畫面
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.trim().toLowerCase();
                updateView();
            });

            // 處理快速搜尋關鍵字點擊
            suggestionButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const keyword = e.target.getAttribute('data-keyword');
                    searchInput.value = keyword;
                    searchQuery = keyword;
                    // 點擊後收合選單
                    searchSuggestions.classList.remove('opacity-100', 'pointer-events-auto');
                    searchSuggestions.classList.add('opacity-0', 'pointer-events-none');
                    updateView();
                });
            });
        }

        function renderFilterButtons() {
            const container = document.getElementById('filterContainer');
            container.innerHTML = '';
            
            const actualCategories = new Set(myPortfolio.map(item => item.category));
            const displayCategories = categoryOrder.filter(c => c === '全部' || actualCategories.has(c));

            displayCategories.forEach(cat => {
                const btn = document.createElement('button');
                const isActive = cat === currentCategory;
                
                btn.className = `px-3.5 py-1.5 rounded-full text-sm font-medium transition-all duration-300 border whitespace-nowrap ${
                    isActive 
                    ? 'bg-sunshine-primary/10 text-sunshine-primary border-sunshine-primary shadow-[0_0_10px_rgba(251,191,36,0.15)]' 
                    : 'bg-transparent text-sunshine-muted border-transparent hover:bg-white/5 hover:text-white'
                }`;
                btn.textContent = cat;
                btn.onclick = () => {
                    currentCategory = cat;
                    renderFilterButtons();
                    updateView();
                };
                container.appendChild(btn);
            });
        }

        function updateView() {
            const container = document.getElementById('portfolioContainer');
            container.innerHTML = '';

            const filteredData = myPortfolio.filter(item => {
                const matchCategory = currentCategory === '全部' || item.category === currentCategory;
                const matchSearch = item.title.toLowerCase().includes(searchQuery) || 
                                   (item.description && item.description.toLowerCase().includes(searchQuery)) ||
                                   (item.tags && item.tags.some(tag => tag.toLowerCase().includes(searchQuery)));
                return matchCategory && matchSearch;
            });

            document.getElementById('gameCount').textContent = filteredData.length;

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-20 flex flex-col items-center justify-center text-sunshine-muted">
                        <svg class="w-16 h-16 mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <p class="text-lg">找不到相關作品</p>
                    </div>`;
                container.className = "w-full"; 
                return;
            }

            container.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 w-full";

            filteredData.forEach(item => {
                const tagsHtml = (item.tags || []).map(tag => 
                    `<span class="text-[10px] font-mono px-2 py-0.5 rounded-sm bg-white/5 text-sunshine-muted border border-white/10 flex items-center gap-1"><span class="text-sunshine-primary/50">#</span>${tag}</span>`
                ).join('');

                // 原本為 addEnergy，因為功能已註解，改為直接在新視窗打開連結
                const onClickAction = `window.open('${item.link}', '_blank')`;

                const cardHTML = `
                    <div class="game-card group cursor-pointer bg-sunshine-card rounded-xl border border-sunshine-border overflow-hidden flex flex-col h-full relative" onclick="${onClickAction}">
                        <div class="h-1 w-full bg-gradient-to-r from-sunshine-primary/20 via-sunshine-primary to-sunshine-primary/20 opacity-50 group-hover:opacity-100 group-hover:h-1.5 transition-all duration-300 shadow-[0_0_10px_rgba(251,191,36,0.5)]"></div>
                        
                        <div class="card-img-wrapper relative aspect-video bg-black/50 border-b border-sunshine-border">
                            <div class="absolute top-3 left-3 z-10">
                                <span class="bg-black/70 backdrop-blur-md text-[10px] font-bold tracking-wider text-white px-2.5 py-1 rounded-sm uppercase border border-white/10 shadow-lg flex items-center gap-1.5">
                                    <div class="w-1.5 h-1.5 rounded-full bg-sunshine-primary"></div>
                                    ${item.category}
                                </span>
                            </div>
                            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x400/27272a/a1a1aa?text=Image+Not+Found'">
                            
                            <div class="play-btn absolute bottom-3 right-3 z-20">
                                <div class="bg-sunshine-primary text-black font-bold text-xs pl-3 pr-4 py-2 rounded-full shadow-[0_0_15px_rgba(251,191,36,0.5)] flex items-center gap-1.5 hover:bg-sunshine-secondary hover:scale-105 transition-transform">
                                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                    PLAY
                                </div>
                            </div>
                        </div>
                        
                        <div class="p-5 flex flex-col flex-grow relative z-10 bg-gradient-to-b from-sunshine-card to-[#1f1f22]">
                            <h3 class="text-xl font-bold text-white mb-2 group-hover:text-sunshine-primary transition-colors">${item.title}</h3>
                            <p class="text-sm text-sunshine-muted leading-relaxed flex-grow mb-4">${item.description}</p>
                            
                            <div class="flex flex-wrap items-center gap-1.5 mt-auto pt-4 border-t border-white/5">
                                <div class="flex flex-wrap gap-1.5 flex-grow">
                                    ${tagsHtml}
                                </div>
                                <span class="ml-auto text-[10px] text-sunshine-muted/60 font-mono tracking-wider pl-2">
                                    ${item.date ? item.date : ''}
                                </span>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }
    </script>
</body>
</html>
