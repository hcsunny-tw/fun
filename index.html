<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunshine Arcade | 晴光遊樂園</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sunshine: {
                            bg: '#18181b',       // zinc-900 柔和深底色
                            card: '#27272a',     // zinc-800 卡片底色
                            text: '#f4f4f5',     // zinc-100 文字顏色
                            muted: '#a1a1aa',    // zinc-400 次要文字
                            primary: '#fbbf24',  // amber-400 溫暖的主色
                            secondary: '#f59e0b',// amber-500
                            border: '#3f3f46'    // zinc-700 邊框顏色
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(251, 191, 36, 0.15)',
                        'glow-lg': '0 0 30px rgba(251, 191, 36, 0.3)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            overflow-x: hidden;
            background-color: #18181b; /* 強制背景色避免 CDN 延遲白頻 */
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }

        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: -1;
            background: 
                radial-gradient(circle at 15% 50%, rgba(251, 191, 36, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(245, 158, 11, 0.03) 0%, transparent 50%);
        }

        .game-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .game-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(251, 191, 36, 0.15);
            border-color: rgba(251, 191, 36, 0.4);
        }
        
        .card-img-wrapper { overflow: hidden; }
        .card-img-wrapper img {
            transition: transform 0.7s ease;
        }
        .game-card:hover .card-img-wrapper img {
            transform: scale(1.08);
        }

        .play-btn {
            opacity: 0;
            transform: translateY(20px) scale(0.9);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .game-card:hover .play-btn {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 99px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 10px 25px rgba(16,185,129,0.4);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            pointer-events: none;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        .filter-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .filter-scroll::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-sunshine-bg text-sunshine-text antialiased min-h-screen flex flex-col relative pt-[72px]">

    <div class="bg-glow"></div>

    <!-- 固定在頂部的 Navbar -->
    <nav class="fixed top-0 w-full h-[72px] px-4 md:px-8 flex justify-between items-center z-50 border-b border-white/5 bg-sunshine-bg/90 backdrop-blur-md shadow-sm gap-4">
        
        <!-- Logo 區塊 -->
        <div class="flex items-center gap-2 cursor-pointer flex-shrink-0" onclick="window.scrollTo({top:0, behavior:'smooth'})">
            <!-- 太陽圖示 -->
            <svg class="w-7 h-7 text-sunshine-primary hidden sm:block" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18.75a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-1.5a.75.75 0 01.75-.75zM6.166 17.834a.75.75 0 00-1.06 1.06l1.59 1.591a.75.75 0 101.061-1.06l-1.591-1.59zM4.5 12a.75.75 0 01-.75-.75H1.5a.75.75 0 010 1.5h2.25a.75.75 0 01.75-.75zM6.166 6.166a.75.75 0 011.06-1.06l1.591 1.59a.75.75 0 11-1.06 1.061l-1.591-1.59z" /></svg>
            <span class="font-bold text-lg tracking-tight text-white hidden md:block">Sunshine Arcade</span>
            <span class="font-bold text-lg tracking-tight text-white md:hidden">Sunshine</span>
        </div>

        <!-- 分類篩選器 (移入 Navbar 中央) -->
        <div class="flex-grow overflow-x-auto filter-scroll flex items-center px-2">
            <div id="filterContainer" class="flex items-center gap-2 mx-auto min-w-max pb-1">
                <!-- JS 動態產生 -->
            </div>
        </div>

        <!-- 搜尋與狀態區塊 -->
        <div class="flex items-center gap-4 flex-shrink-0">
            <!-- 伸縮搜尋框 -->
            <div class="relative flex items-center justify-end">
                <input type="text" id="searchInput" placeholder="搜尋遊戲..." class="w-0 opacity-0 transition-all duration-300 bg-sunshine-card border border-sunshine-border text-white text-sm rounded-full py-1.5 pl-4 pr-9 focus:outline-none focus:border-sunshine-primary focus:ring-1 focus:ring-sunshine-primary placeholder-sunshine-muted absolute right-0">
                <button id="searchToggleBtn" class="text-sunshine-muted hover:text-sunshine-primary transition-colors p-1.5 z-10 relative rounded-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </button>
            </div>

            <!-- Firebase 狀態列 -->
            <div class="hidden lg:flex items-center gap-3 bg-sunshine-card/50 border border-white/5 px-4 py-1 rounded-full shadow-sm">
                <div class="flex items-center gap-2">
                    <div id="dbStatusDot" class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                    <span class="text-[10px] text-sunshine-muted font-mono tracking-wider">FIREBASE</span>
                </div>
                <div class="w-px h-3 bg-white/10 mx-1"></div>
                <div class="flex items-center gap-1">
                    <svg class="w-3.5 h-3.5 text-sunshine-primary" fill="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    <span id="energyCounter" class="text-sunshine-primary font-black font-mono text-base">0</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow w-full max-w-7xl mx-auto px-4 md:px-8 pt-8 pb-24 z-10">
        <!-- 顯示筆數資訊 -->
        <div class="flex justify-between items-end mb-6 border-b border-white/5 pb-2">
            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                <span class="w-1.5 h-6 bg-sunshine-primary rounded-full"></span>
                作品列表
            </h2>
            <p class="text-xs text-sunshine-muted font-mono">共收錄 <span id="gameCount" class="text-sunshine-primary">14</span> 個作品</p>
        </div>

        <div id="portfolioContainer">
            <!-- 卡片會透過 JS 動態生成 -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-white/5 py-8 text-center text-sm font-mono text-sunshine-muted z-10 bg-black/20 mt-auto">
        <p>© 2026 Sunshine Arcade. Crafted for joyful learning.</p>
    </footer>

    <!-- Toast 提示框 -->
    <div id="toast"></div>

    <!-- 回到最上面按鈕 -->
    <button id="backToTopBtn" class="fixed bottom-8 right-8 w-12 h-12 bg-sunshine-primary text-black rounded-full shadow-[0_0_15px_rgba(251,191,36,0.3)] flex items-center justify-center opacity-0 translate-y-10 pointer-events-none transition-all duration-300 z-50 hover:bg-sunshine-secondary hover:scale-110">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" /></svg>
    </button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            projectId: "demo-project" // Dummy config for demonstration
        };

        let db;
        let auth;
        let currentUserUid = null;
        let currentEnergy = 0;
        
        // Setup mock firebase functions for preview environment to prevent errors
        let isMockFirebase = true;
        
        const myPortfolio = [
            // --- 📜 國語遊戲 ---
            { title: "文字森林", image: "https://hcsunny-tw.github.io/fun/img/wordforest.png", link: "https://hcsunny-tw.github.io/fun/wordforest.html", category: "國語遊戲", description: "在森林情境中認識生字與詞語，透過關卡收集道具方式練習國語詞彙。", tags: ["國語", "生字", "遊戲"] },
            { title: "注音煉金術", image: "https://hcsunny-tw.github.io/fun/img/mpsmix.jpg", link: "https://hcsunny-tw.github.io/fun/mpsmix.html", category: "國語遊戲", description: "以煉金合成玩法練習注音符號拼讀，將聲符與韻符組合成正確發音。", tags: ["注音", "拼讀", "遊戲"] },
            { title: "夜市遊戲(注音)", image: "https://hcsunny-tw.github.io/fun/img/nightmarketmps.jpg", link: "https://hcsunny-tw.github.io/fun/nightmarketmps.html", category: "國語遊戲", description: "在台灣傳統夜市攤位的情境中，練習注音符號的辨識與拼讀。", tags: ["注音", "情境", "遊戲"] },
            { title: "聲調跑酷", image: "https://hcsunny-tw.github.io/fun/img/toneparkour.jpg", link: "https://hcsunny-tw.github.io/fun/toneparkour.html", category: "國語遊戲", description: "節奏明快的聲調辨識遊戲，看準聲調快速反應，享受跑酷樂趣。", tags: ["聲調", "反應力"] },
            { title: "同音字宇宙", image: "https://hcsunny-tw.github.io/fun/img/worduniverse.jpg", link: "https://hcsunny-tw.github.io/fun/worduniverse.html", category: "國語遊戲", description: "探索廣闊的同音字宇宙，辨識並收集正確的國字星體。", tags: ["字音字形", "探索"] },

            // --- 📐 數學遊戲 ---
            { title: "九九乘法占地遊戲", image: "https://hcsunny-tw.github.io/fun/img/99.jpg", link: "https://hcsunny-tw.github.io/fun/99/", category: "數學遊戲", description: "兩人對戰的陣地佔領遊戲，透過熟練九九乘法來擴張自己的領地。", tags: ["乘法", "對戰策略"] },

            // --- 🎨 其他遊戲 ---
            { title: "胡麻小廚神", image: "https://hcsunny-tw.github.io/fun/img/sesame-chef.jpg", link: "https://hcsunny-tw.github.io/fun/sesame-chef.html", category: "其他遊戲", description: "化身小廚師，依照顧客需求快速備料，考驗記憶力與手眼協調。", tags: ["記憶", "反應"] },
            { title: "英文找找單字", image: "https://hcsunny-tw.github.io/fun/img/img_wordsearch.png", link: "https://hcsunny-tw.github.io/fun/wordsearch.html", category: "其他遊戲", description: "經典的英文單字搜尋遊戲 (Word Search)，在字母矩陣中找出隱藏詞彙。", tags: ["英文", "觀察力"] },
            { title: "字首字尾單字遊戲", image: "https://hcsunny-tw.github.io/fun/img/img_HeadTailGame.PNG", link: "https://hcsunny-tw.github.io/fun/HeadTailGame.html", category: "其他遊戲", description: "接龍式的英文單字挑戰，利用前一個字的字尾作為下一個字的字首。", tags: ["英文", "字彙量"] },
            
            // ---  教學工具  ---
            { title: "跳跳Tempo", image: "https://hcsunny-tw.github.io/fun/img/jumptempo.jpg", link: "https://hcsunny-tw.github.io/tools/jumptempo.html", category: "工具區", description: "課堂破冰小工具，類似綜藝節目的二選一跳躍節奏遊戲板。", tags: ["課堂互動", "破冰"] },
            { title: "英文找找單生成器", image: "https://hcsunny-tw.github.io/fun/img/word-search-generator.jpg", link: "https://hcsunny-tw.github.io/tools/word-search-generator.html", category: "工具區", description: "教師實用工具，輸入單字列表即可一鍵生成 Word Search 學習單。", tags: ["教師工具", "學習單"] },
            { title: "班級音量小精靈", image: "https://hcsunny-tw.github.io/fun/img/dbtracker.jpg", link: "https://hcsunny-tw.github.io/tools/dbtracker.html", category: "工具區", description: "視覺化班級音量管理工具，音量過大時小精靈會有對應提示。", tags: ["班級經營", "音量控制"] },
            { title: "考試看板", image: "https://hcsunny-tw.github.io/fun/img/examtime.PNG", link: "https://hcsunny-tw.github.io/tools/examtime.html", category: "工具區", description: "考試專用的大時鐘與資訊看板，清楚顯示剩餘時間與注意事項。", tags: ["考試", "計時器"] },
            { title: "作業管理系統", image: "https://hcsunny-tw.github.io/fun/img/hwcheck.JPG", link: "https://hcsunny906.blogspot.com/2026/02/30-g.html", category: "工具區", description: "簡單明瞭的作業缺交登記與查詢系統，方便教師追蹤繳交進度。", tags: ["班務", "追蹤"] }
        ];

        let currentCategory = '全部';
        let searchQuery = '';
        const categoryOrder = ['全部', '國語遊戲', '數學遊戲', '其他遊戲', '工具區'];

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initFirebaseMock();
            document.getElementById('gameCount').textContent = myPortfolio.length;
            renderFilterButtons();
            updateView();
            initSearchLogic();
            initBackToTop();
        });

        function initFirebaseMock() {
            setTimeout(() => {
                const dot = document.getElementById('dbStatusDot');
                dot.classList.remove('bg-red-500', 'animate-pulse');
                dot.classList.add('bg-green-500');
                
                // 模擬讀取
                currentEnergy = parseInt(localStorage.getItem('mockEnergy')) || 150;
                updateEnergyDisplay(currentEnergy);
                
            }, 1500);
        }

        window.addEnergy = function(amount, url) {
            currentEnergy += amount;
            localStorage.setItem('mockEnergy', currentEnergy);
            
            const counter = document.getElementById('energyCounter');
            counter.classList.add('scale-150', 'text-white');
            updateEnergyDisplay(currentEnergy);
            
            setTimeout(() => {
                counter.classList.remove('scale-150', 'text-white');
            }, 300);

            showToast(`🚀 即將啟動！獲得 ${amount} 點登入能量`);
            
            // 延遲跳轉以展示動畫
            setTimeout(() => {
                window.open(url, '_blank');
            }, 800);
        };

        function updateEnergyDisplay(val) {
            document.getElementById('energyCounter').textContent = val;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function initBackToTop() {
            const btn = document.getElementById('backToTopBtn');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    btn.classList.remove('opacity-0', 'translate-y-10', 'pointer-events-none');
                    btn.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
                } else {
                    btn.classList.add('opacity-0', 'translate-y-10', 'pointer-events-none');
                    btn.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
                }
            });
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function initSearchLogic() {
            const searchBtn = document.getElementById('searchToggleBtn');
            const searchInput = document.getElementById('searchInput');
            let isExpanded = false;

            searchBtn.addEventListener('click', () => {
                isExpanded = !isExpanded;
                if(isExpanded) {
                    searchInput.classList.remove('w-0', 'opacity-0');
                    searchInput.classList.add('w-48', 'opacity-100', 'pr-10'); // 給按鈕留空間
                    searchInput.focus();
                } else {
                    searchInput.classList.remove('w-48', 'opacity-100', 'pr-10');
                    searchInput.classList.add('w-0', 'opacity-0');
                    searchInput.value = '';
                    searchQuery = '';
                    updateView();
                }
            });

            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.trim().toLowerCase();
                updateView();
            });
        }

        function renderFilterButtons() {
            const container = document.getElementById('filterContainer');
            container.innerHTML = '';
            
            // 找出實際有的分類
            const actualCategories = new Set(myPortfolio.map(item => item.category));
            const displayCategories = categoryOrder.filter(c => c === '全部' || actualCategories.has(c));

            displayCategories.forEach(cat => {
                const btn = document.createElement('button');
                const isActive = cat === currentCategory;
                
                btn.className = `px-3.5 py-1.5 rounded-full text-sm font-medium transition-all duration-300 border whitespace-nowrap ${
                    isActive 
                    ? 'bg-sunshine-primary/10 text-sunshine-primary border-sunshine-primary shadow-[0_0_10px_rgba(251,191,36,0.15)]' 
                    : 'bg-transparent text-sunshine-muted border-transparent hover:bg-white/5 hover:text-white'
                }`;
                btn.textContent = cat;
                btn.onclick = () => {
                    currentCategory = cat;
                    renderFilterButtons();
                    updateView();
                };
                container.appendChild(btn);
            });
        }

        function updateView() {
            const container = document.getElementById('portfolioContainer');
            container.innerHTML = '';

            const filteredData = myPortfolio.filter(item => {
                const matchCategory = currentCategory === '全部' || item.category === currentCategory;
                const matchSearch = item.title.toLowerCase().includes(searchQuery) || 
                                   (item.description && item.description.toLowerCase().includes(searchQuery)) ||
                                   (item.tags && item.tags.some(tag => tag.toLowerCase().includes(searchQuery)));
                return matchCategory && matchSearch;
            });

            document.getElementById('gameCount').textContent = filteredData.length;

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-20 flex flex-col items-center justify-center text-sunshine-muted">
                        <svg class="w-16 h-16 mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <p class="text-lg">找不到相關作品</p>
                    </div>`;
                container.className = "w-full"; // Remove grid for empty state
                return;
            }

            container.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 w-full";

            filteredData.forEach(item => {
                const tagsHtml = (item.tags || []).map(tag => 
                    `<span class="text-[10px] font-mono px-2 py-0.5 rounded-sm bg-white/5 text-sunshine-muted border border-white/10 flex items-center gap-1"><span class="text-sunshine-primary/50">#</span>${tag}</span>`
                ).join('');

                const onClickAction = item.category === '工具區' 
                    ? `window.open('${item.link}', '_blank')`
                    : `addEnergy(10, '${item.link}')`;

                const cardHTML = `
                    <div class="game-card group cursor-pointer bg-sunshine-card rounded-xl border border-sunshine-border overflow-hidden flex flex-col h-full relative" onclick="${onClickAction}">
                        <!-- Top Accent Line -->
                        <div class="h-1 w-full bg-gradient-to-r from-sunshine-primary/20 via-sunshine-primary to-sunshine-primary/20 opacity-50 group-hover:opacity-100 group-hover:h-1.5 transition-all duration-300 shadow-[0_0_10px_rgba(251,191,36,0.5)]"></div>
                        
                        <!-- Image Container with Badge -->
                        <div class="card-img-wrapper relative aspect-video bg-black/50 border-b border-sunshine-border">
                            <div class="absolute top-3 left-3 z-10">
                                <span class="bg-black/70 backdrop-blur-md text-[10px] font-bold tracking-wider text-white px-2.5 py-1 rounded-sm uppercase border border-white/10 shadow-lg flex items-center gap-1.5">
                                    <div class="w-1.5 h-1.5 rounded-full bg-sunshine-primary"></div>
                                    ${item.category}
                                </span>
                            </div>
                            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x400/27272a/a1a1aa?text=Image+Not+Found'">
                            
                            <!-- Floating Play Button (Bottom Right of Image) -->
                            <div class="play-btn absolute bottom-3 right-3 z-20">
                                <div class="bg-sunshine-primary text-black font-bold text-xs pl-3 pr-4 py-2 rounded-full shadow-[0_0_15px_rgba(251,191,36,0.5)] flex items-center gap-1.5 hover:bg-sunshine-secondary hover:scale-105 transition-transform">
                                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                    PLAY
                                </div>
                            </div>
                        </div>
                        
                        <!-- Content -->
                        <div class="p-5 flex flex-col flex-grow relative z-10 bg-gradient-to-b from-sunshine-card to-[#1f1f22]">
                            <h3 class="text-xl font-bold text-white mb-2 group-hover:text-sunshine-primary transition-colors">${item.title}</h3>
                            <p class="text-sm text-sunshine-muted leading-relaxed flex-grow mb-4">${item.description}</p>
                            <div class="flex flex-wrap gap-1.5 mt-auto pt-4 border-t border-white/5">
                                ${tagsHtml}
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }
    </script>
</body>
</html>
