<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水豚君的野餐派對 - 認識單位分數</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 圖標庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 彩帶特效函式庫 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #FFF7ED 0%, #FFEDD5 100%);
        }

        /* 水豚輕微上下漂浮的閒置動畫 */
        @keyframes bounce-soft {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }
        .animate-bounce-soft {
            animation: bounce-soft 2.5s infinite ease-in-out;
        }

        /* 答錯時抖動的動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.5s ease-in-out;
        }

        /* 彈窗登場縮放動畫 */
        @keyframes pop-in {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-pop-in {
            animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* 閃爍微光特效，用於強調正確切片 */
        @keyframes pulse-gold {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(245, 158, 11, 0.6)); }
            50% { filter: drop-shadow(0 0 25px rgba(245, 158, 11, 1)); }
        }
        .pulse-gold-glow {
            animation: pulse-gold 1.5s infinite ease-in-out;
        }

        /* 披薩切片的通用平滑轉場 */
        .pizza-slice {
            transform-origin: 150px 150px;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-gradient-to-br from-[#FFF7ED] to-[#FFEDD5] flex items-center justify-center p-2 md:p-6">

    <!-- 主視窗容器：限制高度不產生滾動條，並設為橫向開展 -->
    <div class="w-full max-w-5xl h-full max-h-[850px] bg-white rounded-3xl shadow-[0_15px_40px_rgba(251,146,60,0.15)] overflow-hidden border-4 border-orange-200 flex flex-col">
        
        <!-- 精緻的頁首與計分板 -->
        <div class="bg-gradient-to-r from-orange-400 to-amber-500 p-4 text-center relative shrink-0">
            <h1 class="text-xl md:text-3xl font-extrabold text-white tracking-wider drop-shadow-md">
                🍕 水豚君的野餐派對 🐹
            </h1>
            <p class="text-orange-50 text-xs md:text-sm mt-1 font-bold">二年級數學：認識單位分數 (幾分之一)</p>
            
            <!-- 分數進度條 -->
            <div class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/20 backdrop-blur-md py-1 px-3 rounded-full flex items-center gap-1 border border-white/20">
                <span class="text-amber-200 text-sm"><i class="fa-solid fa-star"></i></span>
                <span id="score-text" class="text-white font-black text-sm">進度: 0 / 5</span>
            </div>
        </div>

        <!-- 核心內容區：左右分欄 (不需滾動) -->
        <div class="flex-1 flex flex-col md:flex-row min-h-0 overflow-hidden">
            
            <!-- 左半邊：題目、水豚與披薩 (佔據 60% 空間，保持畫面餘裕) -->
            <div class="flex-[1.5] flex flex-col items-center justify-evenly p-4 relative">
                
                <!-- 題目區塊 -->
                <div class="bg-orange-50 text-amber-900 text-lg md:text-xl font-black px-6 py-3 rounded-2xl shadow-[inset_0_2px_4px_rgba(0,0,0,0.05)] border border-orange-100 flex flex-col items-center gap-1 w-full max-w-md shrink-0">
                    <div class="flex items-center gap-2">
                        <span>請把披薩平分給</span>
                        <span id="target-number" class="text-3xl text-orange-600 font-black px-1">?</span>
                        <span>隻水豚！</span>
                    </div>
                    <div class="text-sm text-orange-600/90 font-bold tracking-wide mt-1 text-center">
                        ( 每隻水豚可以分到其中 1 份，是幾分之一 個披薩？ )
                    </div>
                </div>

                <!-- 水豚群體 (Emoji) -->
                <div id="animal-container" class="flex flex-wrap justify-center items-center gap-2 min-h-[64px] shrink-0">
                    <!-- 由 JS 動態生成 -->
                </div>

                <!-- SVG 畫布：限制最大尺寸以防止超出高度 -->
                <div class="relative w-full max-w-[260px] md:max-w-[320px] aspect-square flex items-center justify-center shrink-0">
                    <svg id="pizza-svg" viewBox="0 0 300 300" class="w-full h-full drop-shadow-xl overflow-visible">
                        <!-- 由 JS 動態渲染 -->
                    </svg>

                    <!-- 浮動分數泡泡 -->
                    <div id="fraction-bubble" class="absolute hidden flex-col items-center justify-center bg-white border-4 border-amber-400 rounded-2xl p-2 shadow-2xl animate-pop-in z-30 pointer-events-none transition-all duration-700" style="width: 80px; height: 95px;">
                        <span class="text-2xl font-black text-amber-600 leading-none">1</span>
                        <hr class="w-8 border-t-4 border-amber-600 my-1 rounded-full">
                        <span id="bubble-denominator" class="text-2xl font-black text-amber-600 leading-none">?</span>
                    </div>
                </div>
            </div>

            <!-- 右半邊：操作選項與提示 (佔據 40% 空間) -->
            <div class="flex-[1] bg-orange-50/50 border-t-2 md:border-t-0 md:border-l-2 border-orange-100 p-6 flex flex-col items-center justify-center shadow-[inset_4px_0_10px_rgba(0,0,0,0.02)] relative">
                
                <h3 class="text-lg font-bold text-orange-800 mb-8 flex items-center gap-2">
                    <i class="fa-solid fa-hand-pointer text-orange-500"></i> 請選擇正確的單位分數
                </h3>

                <!-- 選項按鈕區 -->
                <div id="btn-container" class="grid grid-cols-2 gap-5 w-full max-w-[280px]">
                    <!-- 按鈕由 JS 動態生成 -->
                </div>

                <!-- 溫馨小提示 (固定於右側底部) -->
                <div class="absolute bottom-6 w-full flex justify-center px-4">
                    <p class="text-sm text-orange-600/80 font-bold bg-orange-100/80 px-4 py-2 rounded-full text-center">
                        <i class="fa-solid fa-lightbulb mr-1"></i> 點選後，觀察哪一塊披薩飛出來喔！
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div id="success-modal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full text-center animate-pop-in border-4 border-amber-400 shadow-[0_20px_50px_rgba(0,0,0,0.3)]">
            <div class="text-5xl md:text-6xl mb-3 animate-bounce-soft">🎉</div>
            <h2 class="text-2xl font-extrabold text-slate-800 mb-1">太厲害了！分對了！</h2>
            <p class="text-slate-500 mb-5 font-bold text-sm">每一隻水豚可以分到這「其中一份」：</p>
            
            <!-- 教育心理學：極具儀式感的垂直分數卡 -->
            <div id="modal-fraction" class="mb-6 flex flex-col items-center">
                <!-- JS 動態寫入標準分數結構 -->
            </div>

            <button onclick="nextLevel()" class="w-full py-3.5 bg-gradient-to-r from-orange-400 to-amber-500 hover:from-orange-500 hover:to-amber-600 text-white text-lg font-black rounded-2xl shadow-lg shadow-orange-500/20 active:scale-95 transition-all">
                下一關 🐹 <i class="fa-solid fa-arrow-right ml-1"></i>
            </button>
        </div>
    </div>

    <!-- 終極過關慶祝視窗 -->
    <div id="complete-modal" class="fixed inset-0 bg-slate-900/70 hidden items-center justify-center z-[60] p-4 backdrop-blur-md">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center animate-pop-in border-4 border-yellow-400 shadow-[0_20px_60px_rgba(250,204,21,0.4)]">
            <div class="text-6xl md:text-7xl mb-4 animate-bounce-soft">🏆</div>
            <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-yellow-500 mb-2">恭喜過關！</h2>
            <p class="text-slate-600 mb-6 font-bold text-lg">你太棒了！已經完全學會<br><span class="text-orange-600">「單位分數」</span>了！</p>
            
            <button onclick="restartGame()" class="w-full py-3.5 bg-gradient-to-r from-yellow-400 to-orange-500 hover:from-yellow-500 hover:to-orange-600 text-white text-xl font-black rounded-2xl shadow-lg shadow-yellow-500/30 active:scale-95 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-right"></i> 再玩一次
            </button>
        </div>
    </div>

    <script>
        let currentAnimals = 2;
        let score = 0;
        const totalLevels = 5;
        const options = [2, 3, 4, 5, 6, 8];
        let gameLocked = false; // 防止在動畫期間重置或重覆點擊

        // 初始化遊戲
        function initGame() {
            gameLocked = false;
            // 隱藏分數浮動泡泡
            const bubble = document.getElementById('fraction-bubble');
            bubble.classList.add('hidden');
            bubble.style.transform = 'translate(0, 0) scale(0)';

            // 隨機選定本關卡水豚數量
            currentAnimals = options[Math.floor(Math.random() * options.length)];
            
            document.getElementById('target-number').innerText = currentAnimals;
            document.getElementById('score-text').innerText = `進度: ${score} / ${totalLevels}`;
            
            renderCapybaras(currentAnimals);
            drawPizza(1); // 起始是一塊完整的美味披薩
            generateButtons();
        }

        // 渲染水豚 (使用經典水豚化身：倉鼠 🐹，圓滾滾最討喜)
        function renderCapybaras(count) {
            const container = document.getElementById('animal-container');
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const capy = document.createElement('div');
                capy.className = 'text-4xl md:text-5xl animate-bounce-soft';
                // 讓每隻水豚的上下漂浮時間微幅錯開，看起來更自然、生動
                capy.style.animationDelay = `${i * 0.15}s`;
                capy.textContent = '🐹'; 
                container.appendChild(capy);
            }
        }

        // 產生選項按鈕
        function generateButtons() {
            const container = document.getElementById('btn-container');
            container.innerHTML = '';
            
            // 保證包含正確答案的 4 個選項
            let buttonOptions = [currentAnimals];
            while (buttonOptions.length < 4) {
                let randomOpt = options[Math.floor(Math.random() * options.length)];
                if (!buttonOptions.includes(randomOpt)) {
                    buttonOptions.push(randomOpt);
                }
            }
            // 隨機打亂按鈕順序
            buttonOptions.sort(() => Math.random() - 0.5);

            buttonOptions.forEach(num => {
                const btn = document.createElement('button');
                // 調整按鈕外框與點擊回饋，使其更像一個精緻的數學卡片
                btn.className = 'p-2 bg-white border-2 border-orange-200 hover:border-orange-400 hover:bg-amber-50/30 rounded-2xl shadow-sm hover:shadow-md active:scale-95 transition-all flex items-center justify-center';
                
                // 按鈕改為純粹的「直式單位分數」，完全不洩露中文描述，逼真模擬課本上的分數排版
                btn.innerHTML = `
                    <div class="flex flex-col items-center justify-center bg-amber-50/50 hover:bg-amber-100/50 py-3 rounded-xl border border-amber-200/60 shadow-[inset_0_2px_4px_rgba(251,191,36,0.05)] w-full transition-all">
                        <span class="text-2xl font-black text-amber-700 leading-none">1</span>
                        <div class="w-8 h-1 bg-amber-500 rounded-full my-1.5"></div>
                        <span class="text-2xl font-black text-amber-700 leading-none">${num}</span>
                    </div>
                `;
                btn.onclick = () => {
                    if (!gameLocked) checkAnswer(num);
                };
                container.appendChild(btn);
            });
        }

        // 極座標轉換為 SVG 直角座標 (繪製弧線必備)
        function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
            const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
            return {
                x: centerX + (radius * Math.cos(angleInRadians)),
                y: centerY + (radius * Math.sin(angleInRadians))
            };
        }

        // 產生 SVG 扇形路徑
        function describeArc(x, y, radius, startAngle, endAngle){
            const start = polarToCartesian(x, y, radius, endAngle);
            const end = polarToCartesian(x, y, radius, startAngle);
            const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
            return [
                "M", x, y,
                "L", start.x, start.y,
                "A", radius, radius, 0, largeArcFlag, 0, end.x, end.y,
                "Z"
            ].join(" ");
        }

        // 繪製披薩 (主繪製核心)
        function drawPizza(slices) {
            const svg = document.getElementById('pizza-svg');
            svg.innerHTML = ''; // 清空舊圖層

            // 1. 底盤 (木製餐托盤，富有溫潤感)
            const plate = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            plate.setAttribute('cx', 150);
            plate.setAttribute('cy', 150);
            plate.setAttribute('r', 125);
            plate.setAttribute('fill', '#D08770'); 
            svg.appendChild(plate);

            const innerPlate = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            innerPlate.setAttribute('cx', 150);
            innerPlate.setAttribute('cy', 150);
            innerPlate.setAttribute('r', 115);
            innerPlate.setAttribute('fill', '#EBCB8B'); 
            svg.appendChild(innerPlate);

            // 完整一塊披薩的特殊視覺 (未切分前)
            if (slices === 1) {
                // 烘烤金黃餅皮
                const crust = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                crust.setAttribute('cx', 150);
                crust.setAttribute('cy', 150);
                crust.setAttribute('r', 105);
                crust.setAttribute('fill', '#B45309'); 
                svg.appendChild(crust);

                // 起司層
                const cheese = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                cheese.setAttribute('cx', 150);
                cheese.setAttribute('cy', 150);
                cheese.setAttribute('r', 95);
                cheese.setAttribute('fill', '#FBBF24'); 
                svg.appendChild(cheese);

                // 美味臘腸片
                const pepperonis = [
                    {x: 110, y: 110, r: 11}, {x: 185, y: 120, r: 13}, 
                    {x: 140, y: 195, r: 12}, {x: 195, y: 175, r: 10},
                    {x: 105, y: 170, r: 12}, {x: 150, y: 135, r: 14}
                ];
                pepperonis.forEach(p => {
                    const pep = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    pep.setAttribute('cx', p.x);
                    pep.setAttribute('cy', p.y);
                    pep.setAttribute('r', p.r);
                    pep.setAttribute('fill', '#DC2626'); 
                    svg.appendChild(pep);
                });
                return;
            }

            for (let i = 0; i < slices; i++) {
                const startAngle = i * (360 / slices);
                const endAngle = (i + 1) * (360 / slices);
                
                // 創建裝載單個切片的群組
                const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                group.classList.add('pizza-slice');
                group.setAttribute('id', `slice-${i}`);
                
                // 微微收縮切片以突顯切痕
                group.style.transform = 'scale(0.97)';

                // 單片餅皮
                const crustSlice = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                crustSlice.setAttribute('d', describeArc(150, 150, 105, startAngle, endAngle));
                crustSlice.setAttribute('fill', '#B45309');
                group.appendChild(crustSlice);

                // 單片起司
                const cheeseSlice = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                cheeseSlice.setAttribute('d', describeArc(150, 150, 95, startAngle, endAngle));
                cheeseSlice.setAttribute('fill', '#FBBF24');
                cheeseSlice.setAttribute('stroke', '#B45309');
                cheeseSlice.setAttribute('stroke-width', '1.5');
                group.appendChild(cheeseSlice);

                // 每一片上面均等放一片臘腸
                const midAngle = startAngle + (180 / slices);
                const pos = polarToCartesian(150, 150, 60, midAngle);
                const pep = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                pep.setAttribute('cx', pos.x);
                pep.setAttribute('cy', pos.y);
                pep.setAttribute('r', slices > 6 ? 7 : 10); // 隨份數變多自動縮小臘腸
                pep.setAttribute('fill', '#DC2626');
                group.appendChild(pep);

                svg.appendChild(group);
            }
        }

        function checkAnswer(slices) {
            gameLocked = true; // 鎖定操作防重複觸發
            drawPizza(slices);
            
            if (slices === currentAnimals) {
                // 答對時：精準提取「第 0 片」作為飛出的特色單位分數 slice
                const featuredSlice = document.getElementById('slice-0');
                const startAngle = 0;
                const endAngle = 360 / slices;
                const midAngle = (startAngle + endAngle) / 2;
                
                // 根據第 0 片的平分角平分線方向，計算飛出向量 (向外推出 35 像素，並放大 1.15 倍)
                const rad = (midAngle - 90) * Math.PI / 180;
                const dx = Math.cos(rad) * 35;
                const dy = Math.sin(rad) * 35;

                // 讓其他切片稍微淡出，突顯主角切片
                for (let i = 1; i < slices; i++) {
                    const sibling = document.getElementById(`slice-${i}`);
                    if (sibling) sibling.style.opacity = '0.25';
                }

                // 啟動特色切片動態：飛出、放大、閃耀金光
                setTimeout(() => {
                    featuredSlice.style.transform = `translate(${dx}px, ${dy}px) scale(1.15)`;
                    featuredSlice.classList.add('pulse-gold-glow');
                    
                    // 動態定位並顯現 1/N 漂浮分數泡泡
                    const bubble = document.getElementById('fraction-bubble');
                    const denominatorEl = document.getElementById('bubble-denominator');
                    denominatorEl.innerText = slices;
                    
                    // 計算泡泡位置 (讓它剛好落在飛出切片的中央上方)
                    const pizzaContainer = document.getElementById('pizza-svg').getBoundingClientRect();
                    const centerX = 150 + dx;
                    const centerY = 150 + dy;
                    const bubblePos = polarToCartesian(centerX, centerY, 60, midAngle);
                    
                    // 將 SVG 的比例座標轉換為 CSS 百分比定位
                    const pctX = (bubblePos.x / 300) * 100;
                    const pctY = (bubblePos.y / 300) * 100;
                    
                    bubble.style.left = `calc(${pctX}% - 40px)`;
                    bubble.style.top = `calc(${pctY}% - 47px)`;
                    bubble.classList.remove('hidden');
                }, 100);

                // 1.8 秒後平滑展現大成功的垂直分數 Modal 詳情
                setTimeout(() => {
                    showModal(slices);
                }, 1800);

            } else {
                // 答錯時：晃動披薩盤，並重置回完整未切狀態
                const svg = document.getElementById('pizza-svg');
                svg.classList.add('animate-shake');
                setTimeout(() => {
                    svg.classList.remove('animate-shake');
                    drawPizza(1); 
                    gameLocked = false;
                }, 600);
            }
        }

        function showModal(slices) {
            const modal = document.getElementById('success-modal');
            const modalFraction = document.getElementById('modal-fraction');
            
            // 垂直分數 HTML：標準的上下分數線排版，附讀音提示
            modalFraction.innerHTML = `
                <div class="inline-flex flex-col items-center justify-center text-5xl font-black text-amber-600 bg-amber-50 px-8 py-4 rounded-3xl border-4 border-amber-200 shadow-[inset_0_4px_10px_rgba(251,191,36,0.1)]">
                    <span class="leading-none mb-1">1</span>
                    <div class="w-12 h-1.5 bg-amber-500 rounded-full my-1"></div>
                    <span class="leading-none mt-1">${slices}</span>
                </div>
                <div class="mt-4 text-lg text-amber-800 font-extrabold tracking-wider bg-orange-100/50 px-4 py-1.5 rounded-full">
                    讀作：${slices} 分之 1
                </div>
            `;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        // 點選下一關
        function nextLevel() {
            const modal = document.getElementById('success-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            
            // 累加關卡進度
            score++;
            
            if (score >= totalLevels) {
                // 達到 5 關，觸發破關慶祝
                document.getElementById('score-text').innerText = `進度: ${totalLevels} / ${totalLevels}`;
                showCompleteModal();
            } else {
                initGame();
            }
        }

        // 顯示終極破關視窗與彩帶特效
        function showCompleteModal() {
            const completeModal = document.getElementById('complete-modal');
            completeModal.classList.remove('hidden');
            completeModal.classList.add('flex');
            
            // 觸發華麗的從左右兩側噴射彩帶特效
            const end = Date.now() + 3000;
            const colors = ['#f59e0b', '#fbbf24', '#f87171', '#60a5fa', '#34d399'];

            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: colors });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: colors });
                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // 重新開始遊戲
        function restartGame() {
            score = 0;
            const completeModal = document.getElementById('complete-modal');
            completeModal.classList.add('hidden');
            completeModal.classList.remove('flex');
            initGame();
        }

        // 網頁加載完成立即啟動
        window.onload = initGame;
    </script>
</body>
</html>
